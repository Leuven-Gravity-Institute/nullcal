[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nullcal"
authors = [
  { name = "Isaac C. F. Wong", email = "chunfung.wong@kuleuven.be" },
  { name = "Milan Wils", email = "milan.wils@kuleuven.be" },
  { name = "Francesco Cireddu", email = "francesco.cireddu@kuleuven.be" },
]
description = "A package to constrain calibration errors of a closed-geometry network of gravitational-wave detectors."
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "numpy>=1.26.4",
  "nptyping>=2.5.0",
  "bilby>=2.8.1",
  "bilby_pipe>=1.9.0",
  "numba>=0.65.1",
  "scipy>=1.16.3",
  "ConfigArgParse>=1.7.5",
  "pycbc>=2.11.0",
  "healpy>=1.19.0",
  "rocket-fft>=0.3.1",
  "tables>=3.11.1",
  # Imported directly by nullcal (result/, clustering/, metadata/) but previously undeclared:
  # they resolved only transitively through bilby, which is being removed.
  #
  # Floors follow the SPEC 0 policy in [tool.dependency-support-policy], not the code's API needs,
  # which are ancient (read_csv/to_csv/DataFrame; safe_load/safe_dump). Two reasons: the
  # lowest-direct CI job installs exactly these, making a declared floor a *tested* bound; and
  # support_floor_update.yml raises floors on a schedule anyway, so a lower one would not survive.
  # The envelope spans two pandas generations - the lock resolves 3.0.5 below Python 3.14 and
  # 2.3.3 at or above it - which the stable APIs above tolerate.
  "pandas>=2.3.3",
  "pyyaml>=6.0.3",
]

[project.scripts]

[project.optional-dependencies]
spark = ["pyspark>=4.2.0"]

[project.urls]
Source = "https://github.com/Leuven-Gravity-Institute/nullcal"
Tracker = "https://github.com/Leuven-Gravity-Institute/nullcal/issues"

[dependency-groups]
dev = [
  "ruff>=0.16.2",
  "prek>=0.4.12",
  "pytest-github-actions-annotate-failures>=0.4.2",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
]

docs = ["zensical>=0.0.53", "mkdocstrings-python>=2.0.5"]
build = ["hatch>=1.17.1"]
release = ["git-cliff>=2.13.1"]

[tool.dependency-support-policy]
# Rolling support floors (SPEC 0): runtime lower bounds are raised on a schedule
# by the support_floor_update.yml workflow, not by Renovate. See renovate.json.
policy = "spec0"
groups = ["project"]
lock = "minimal"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/nullcal"]

[tool.coverage.run]
branch = true
parallel = true
source = ["src"]

[tool.coverage.report]
fail_under = 0 # Temporary: set non-zero threshold once coverage improves

[tool.pytest.ini_options]
addopts = "--cov=nullcal --cov-report=xml --cov-report=term --cov-append -m 'not integration and not e2e'"
pythonpath = ["src"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
  "e2e: end-to-end characterisation tests against frozen reference artifacts",
]

[tool.ruff]
line-length = 120
target-version = "py312"
lint.extend-select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Pylint rules
  "SIM", # Similarities
  "T10", # Debugger statements
  "S",   # Security rules
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Overly strict complexity
]
lint.pylint.max-args = 10
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
